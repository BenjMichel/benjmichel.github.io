<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
<title id="title">Architecture globale de Tilli</title>
<desc id="desc">Six interfaces sont reliées à une API Node.js commune : site client React, plugin e-commerce Shopify ou JavaScript natif, plateforme vendeurs React, application artisan React Native, plateforme atelier React et administration React. Tilli Core partage du code JavaScript entre les projets. L’API gère les commandes, le matching, les partenaires, les paiements et la facturation. Les données MongoDB passent par un ETL interne vers MySQL puis Metabase. L’API se connecte également à Mangopay, Refashion, aux services e-mail et SMS et aux accès partenaires FTP et API. Vue simplifiée de l’architecture historique documentée en novembre 2025.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#acc5ff"/></marker>
<style>text{font-family:Arial,sans-serif;fill:#f4f2ea}.muted{fill:#b4bfd1;font-size:18px}.label{font-size:22px;font-weight:bold}.tech{fill:#acc5ff;font-size:18px}.node{fill:#101e37;stroke:#465976;stroke-width:1.5}.flow{fill:none;stroke:#acc5ff;stroke-width:2;marker-end:url(#arrow)}.bus{fill:none;stroke:#acc5ff;stroke-width:2}</style></defs>
